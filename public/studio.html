<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Studio · Seasons</title>
<link rel="stylesheet" href="/styles/studio.css">
<script type="module" src="/js/opening-studio.js"></script>
</head>
<body>
<header><a href="/">← Seasons</a><h1>Opening Studio</h1></header>
<main>
<div>
<form id="access" class="panel">
<label>Studio access key<input type="password" id="key" required></label>
<button>Connect to Notion</button>
</form>
<form id="settings" class="panel" hidden>
<label>Chapter<select id="chapter"></select></label>
<div class="actions"><button type="button" id="reload">Reload from Notion</button><a href="https://app.notion.com/p/41e3bfeccf32818888b3f02ea613ea2d" target="_blank" rel="noopener">Open Notion ↗</a></div>
<fieldset id="fields" disabled>
<div class="fields">
<label class="wide">Center word<input name="word" maxlength="11" required></label>
<label>Solid tile color<input type="color" name="tileColor"></label>
<label>Letter color<input type="color" name="textColor"></label>
<label>Starting tilt (°)<input name="tilt" type="number" required></label>
<label>Zoom out (sec)<input name="zoomSeconds" type="number" required></label>
<label>Photo fade (sec)<input name="fadeSeconds" type="number" required></label>
<label>Reveal at (sec)<input name="revealSeconds" type="number" required></label>
<label>Desktop tile gap (px)<input name="spacing" type="number" required></label>
<label class="wide">Photos<textarea name="photos" rows="5" spellcheck="false" aria-describedby="photo-help"></textarea></label>
<small class="wide" id="photo-help">One public HTTPS image URL per line, in the order you want. Leave blank to use the original photos.</small>
</div>
<button class="primary">Save to Notion</button>
</fieldset>
</form>
<p id="status" role="status" aria-live="polite"></p>
</div>
<section class="preview" aria-label="Opening preview">
<div class="actions"><button id="replay" disabled>Replay preview</button><button id="phone" aria-pressed="false">Phone view</button></div>
<canvas role="img" aria-label="Opening animation preview"></canvas>
</section>
</main>
</body>
</html>
