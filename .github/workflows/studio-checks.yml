name: Seasons Studio checks
on:
  push:
    branches:
      - feature/seasons-studio-foundation
      - feature/studio-modular-workspace
      - feature/seasons-immersive-home
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check server/studio-data.js
          node --check server/studio-operations.js
          node --check server/studio-centers.js
          node --check server/studio-permissions.js
          node --check server/public-document.js
          node --check server/studio-drafts.js
          node --check private/studio/app.js
          node --check private/studio/components/ui.js
          node --check private/studio/pages/workspace.js
          node --check private/studio/editor/opening.js
          node --check public/js/app.js
      - name: Run Studio integration tests
        run: npm test
